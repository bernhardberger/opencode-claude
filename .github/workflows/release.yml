name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version (e.g., 0.3.0). If empty, bump type is used.'
        required: false
        type: string
      bump:
        description: 'Version bump type (used if version is empty)'
        required: false
        default: 'patch'
        type: choice
        options:
          - minor
          - patch
          - major
      dry_run:
        description: 'Dry run — test, build and pack only; no publish, push or release'
        required: false
        default: false
        type: boolean

env:
  # Node 24 ships npm 11, which trusted publishing (OIDC) needs.
  NODE_VERSION: '24'

permissions:
  contents: write
  id-token: write # npm provenance and trusted publishing

jobs:
  release:
    if: github.repository == 'bernhardberger/opencode-claude'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get current version from package.json
        id: current_version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Calculate new version
        id: version
        env:
          CURRENT_VERSION: ${{ steps.current_version.outputs.version }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          BUMP_TYPE: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_VERSION" ]]; then
            # Validate semver
            if ! echo "$INPUT_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Error: version must be in semver format X.Y.Z"
              exit 1
            fi
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
            case "$BUMP_TYPE" in
              major) echo "version=$((major+1)).0.0" >> "$GITHUB_OUTPUT" ;;
              minor) echo "version=$major.$((minor+1)).0" >> "$GITHUB_OUTPUT" ;;
              patch) echo "version=$major.$minor.$((patch+1))" >> "$GITHUB_OUTPUT" ;;
              *) echo "Error: unknown bump type $BUMP_TYPE"; exit 1 ;;
            esac
          fi

      - name: Show version info
        run: |
          echo "Current version: ${{ steps.current_version.outputs.version }}"
          echo "New version:     ${{ steps.version.outputs.version }}"
          echo "Dry run:         ${{ github.event.inputs.dry_run == 'true' && 'yes' || 'no' }}"

      - name: Update package.json version
        run: |
          node -e "
            const pkg = require('./package.json');
            pkg.version = '${{ steps.version.outputs.version }}';
            require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Date the Unreleased changelog section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "0,/^## Unreleased$/s//## ${VERSION} - $(date -u +%Y-%m-%d)/" CHANGELOG.md

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build package
        run: bun run build

      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          if git ls-files --modified --others | grep -q bun.lock; then
            git add bun.lock
          fi
          git commit -m "chore: release v${VERSION}"
          git tag "v${VERSION}"

      # Uses NPM_TOKEN when it is set (needed once, for the very first publish:
      # trusted publishing can only be configured for a package that exists).
      # Without it, npm authenticates through GitHub OIDC trusted publishing.
      - name: Publish to npm
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push release commit and tag
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git push origin "v${VERSION}"
          git push origin "HEAD:${BRANCH}"

      - name: Dry run package contents
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: npm pack --dry-run

      - name: Create GitHub Release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          name: v${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
